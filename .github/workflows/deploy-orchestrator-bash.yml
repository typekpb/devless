name: Deploy Orchestrator Bash

on:
  push:
    branches: [main]
    paths:
      - 'orchestrator-bash/**'
      - '.github/workflows/deploy-orchestrator-bash.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  docker:
    name: Build & Push & Deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get ECR URL
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names devless-orchestrator-bash \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "url=${ECR_URL}" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: orchestrator-bash/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.url }}:${{ github.sha }}
            ${{ steps.ecr.outputs.url }}:latest

      - name: Force ECS redeployment (if service has desired_count > 0)
        run: |
          DESIRED=$(aws ecs describe-services \
            --cluster devless-cluster \
            --services devless-orchestrator-bash \
            --query 'services[0].desiredCount' \
            --output text 2>/dev/null || echo "0")
          if [ "$DESIRED" != "0" ]; then
            aws ecs update-service \
              --cluster devless-cluster \
              --service devless-orchestrator-bash \
              --force-new-deployment \
              --region "$AWS_REGION"
          else
            echo "Service has desired_count=0, skipping redeployment"
          fi
