name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_github_app_id: ${{ secrets.TF_VAR_github_app_id }}
  TF_VAR_github_app_private_key: ${{ secrets.TF_VAR_github_app_private_key }}
  TF_VAR_github_app_installation_id: ${{ secrets.TF_VAR_github_app_installation_id }}
  TF_VAR_openai_api_key: ${{ secrets.TF_VAR_openai_api_key }}
  TF_VAR_webhook_secret: ${{ secrets.TF_VAR_webhook_secret }}
  TF_VAR_github_actions_org: ${{ secrets.TF_VAR_github_actions_org }}

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      ecr_repository_url: ${{ steps.tf-output.outputs.ecr_repository_url }}
      ecs_cluster_name: ${{ steps.tf-output.outputs.ecs_cluster_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Export outputs
        id: tf-output
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          echo "ecr_repository_url=${ECR_URL}" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster_name=${CLUSTER}" >> "$GITHUB_OUTPUT"
          if [ -z "$ECR_URL" ]; then echo "ERROR: ecr_repository_url is empty" && exit 1; fi

  docker:
    name: Build & Push Orchestrator Image
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          ECR_URL="${{ needs.terraform.outputs.ecr_repository_url }}"
          docker build -t "$ECR_URL:${{ github.sha }}" -t "$ECR_URL:latest" orchestrator/
          docker push "$ECR_URL:${{ github.sha }}"
          docker push "$ECR_URL:latest"

      - name: Force ECS redeployment
        run: |
          aws ecs update-service \
            --cluster "${{ needs.terraform.outputs.ecs_cluster_name }}" \
            --service devless-orchestrator \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"
