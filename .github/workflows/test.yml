name: Test

on:
  push:
    paths:
      - 'lambda/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'lambda/**'
      - '.github/workflows/test.yml'

jobs:
  lambdas:
    name: Lambda tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r lambda/webhook_handler/requirements.txt
          pip install -r lambda/dlq_processor/requirements.txt

      - name: Test
        env:
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          pytest lambda/webhook_handler/tests/ -v
          pytest lambda/dlq_processor/tests/ -v
