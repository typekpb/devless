name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'lambda/**'
      - '.github/workflows/deploy-infra.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_github_app_id: ${{ secrets.TF_VAR_github_app_id }}
  TF_VAR_github_app_private_key: ${{ secrets.TF_VAR_github_app_private_key }}
  TF_VAR_github_app_installation_id: ${{ secrets.TF_VAR_github_app_installation_id }}
  TF_VAR_openai_api_key: ${{ secrets.TF_VAR_openai_api_key }}
  TF_VAR_webhook_secret: ${{ secrets.TF_VAR_webhook_secret }}
  TF_VAR_github_actions_org: ${{ secrets.TF_VAR_github_actions_org }}

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda packages
        run: |
          for fn in webhook_handler dlq_processor; do
            rm -rf modules/lambda/builds/$fn
            mkdir -p modules/lambda/builds/$fn
            pip install -r ../lambda/$fn/requirements.txt -t modules/lambda/builds/$fn --quiet
            cp ../lambda/$fn/handler.py modules/lambda/builds/$fn/
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
