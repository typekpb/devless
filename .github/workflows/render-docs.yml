name: Render Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/*.puml'
      - 'presentation/slides.md'
      - '.github/workflows/render-docs.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (for PlantUML)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install PlantUML
        run: |
          wget -q https://github.com/plantuml/plantuml/releases/download/v1.2024.8/plantuml-1.2024.8.jar -O /tmp/plantuml.jar

      - name: Render PlantUML diagrams
        run: |
          cd docs
          for puml in *.puml; do
            echo "Rendering $puml..."
            java -jar /tmp/plantuml.jar -tsvg "$puml"
          done

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Render slides to PDF
        run: |
          cd presentation
          marp slides.md --pdf --allow-local-files -o slides.pdf

      - name: Commit rendered files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.svg presentation/slides.pdf
          git diff --staged --quiet || git commit -m "chore: render diagrams and slides [skip ci]"
          git push
