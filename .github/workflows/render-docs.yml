name: Render Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/*.puml'
      - 'docs/*.drawio'
      - 'presentation/slides.md'
      - '.github/workflows/render-docs.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render PlantUML diagrams
        uses: grassedge/generate-plantuml-action@v1.5
        with:
          path: docs
          message: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render drawio diagrams
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: docs
          format: svg
          transparent: false

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Render slides to PDF
        run: |
          cd presentation
          marp slides.md --pdf --allow-local-files -o slides.pdf

      - name: Commit rendered files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.svg presentation/slides.pdf
          git diff --staged --quiet || git commit -m "chore: render diagrams and slides [skip ci]"
          git push
