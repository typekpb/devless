name: Deploy Orchestrator Agent

on:
  push:
    branches: [main]
    paths:
      - 'orchestrator-agent/**'
      - '.github/workflows/deploy-orchestrator-agent.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  docker:
    name: Build & Push & Deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get ECR URL
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names devless-orchestrator-agent \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "url=${ECR_URL}" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: orchestrator-agent/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.url }}:${{ github.sha }}
            ${{ steps.ecr.outputs.url }}:latest

      - name: Force ECS redeployment
        run: |
          aws ecs update-service \
            --cluster devless-cluster \
            --service devless-orchestrator-agent \
            --force-new-deployment \
            --region "$AWS_REGION"
