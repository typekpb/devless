# .devless/config.yml — Azure OpenAI backend
#
# Uses Azure-hosted OpenAI models. Requires the following env vars
# on the orchestrator (configured via Terraform/SSM):
#   AZURE_API_KEY
#   AZURE_API_BASE       (e.g. https://your-resource.openai.azure.com)
#   AZURE_API_VERSION    (e.g. 2024-06-01)
#
# Aider model format for Azure: azure/<your-deployment-name>

model: azure/gpt-4o       # must match your Azure deployment name
test_command: pytest
max_iterations: 10
