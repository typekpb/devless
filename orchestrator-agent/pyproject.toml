[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devless-agent"
version = "0.1.0"
description = "Devless Agent-based Orchestrator"
requires-python = ">=3.10,<3.13"
dependencies = [
    "strands-agents>=0.1.0",
    "aider-chat[playwright]>=0.50.0",
    "boto3>=1.34.0",
    "PyGithub>=2.1.0",
    "gitpython>=3.1.40",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
