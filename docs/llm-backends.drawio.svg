<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1" width="720" height="540" viewBox="-5 -5 720 540"
     content="see docs/llm-backends.drawio for editable source">
  <defs>
    <style type="text/css">
      .bg { rx:8; ry:8; }
      .lbl { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; dominant-baseline:central; }
      .arrow { fill:none; stroke-width:2; }
      .arrow-d { fill:none; stroke-width:1.5; stroke-dasharray:5 3; }
      marker polygon { stroke:none; }
    </style>
    <marker id="a-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#388E3C"/></marker>
    <marker id="a-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1565C0"/></marker>
    <marker id="a-navy" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#283593"/></marker>
    <marker id="a-grey" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#546E7A"/></marker>
    <marker id="a-yellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F9A825"/></marker>
  </defs>

  <!-- ── Orchestrator boundary ── -->
  <rect x="0" y="0" width="340" height="510" class="bg" fill="#FFF3E0" stroke="#ED7100" stroke-width="2"/>
  <text x="15" y="18" class="lbl" fill="#D46200" font-size="13" font-weight="700">ECS Orchestrator</text>

  <!-- Pipeline Runner -->
  <rect x="40" y="40" width="260" height="38" rx="6" fill="#ED7100"/>
  <text x="170" y="59" class="lbl" fill="#fff" font-size="12" text-anchor="middle">Pipeline Runner</text>

  <!-- Aider boundary -->
  <rect x="20" y="100" width="300" height="390" class="bg" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="35" y="118" class="lbl" fill="#1565C0" font-size="13" font-weight="700">Aider</text>

  <!-- Aider Core -->
  <rect x="55" y="138" width="230" height="46" rx="6" fill="#1976D2"/>
  <text x="170" y="155" class="lbl" fill="#fff" font-size="12" text-anchor="middle">Aider Core</text>
  <text x="170" y="172" class="lbl" fill="#fff" font-size="10" text-anchor="middle">code editing · git ops · test runner</text>

  <!-- Model Router (diamond) -->
  <polygon points="170,210 260,270 170,330 80,270" fill="#1976D2"/>
  <text x="170" y="262" class="lbl" fill="#fff" font-size="11" text-anchor="middle">Model</text>
  <text x="170" y="278" class="lbl" fill="#fff" font-size="11" text-anchor="middle">Router</text>

  <!-- .devless/config.yml -->
  <rect x="55" y="370" width="230" height="55" rx="4" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
  <polygon points="245,370 285,370 275,384 245,384" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
  <text x="170" y="390" class="lbl" fill="#333" font-size="11" text-anchor="middle">.devless/config.yml</text>
  <text x="170" y="408" class="lbl" fill="#666" font-size="10" text-anchor="middle">model: bedrock/... | o3 | azure/...</text>

  <!-- ── Backend boxes ── -->

  <!-- Bedrock -->
  <rect x="420" y="20" width="280" height="120" class="bg" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
  <rect x="480" y="40" width="150" height="36" rx="6" fill="#01A88D"/>
  <text x="555" y="58" class="lbl" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Amazon Bedrock</text>
  <text x="435" y="95" class="lbl" fill="#2E7D32" font-size="10" text-anchor="start">Auth: IAM task role</text>
  <text x="435" y="110" class="lbl" fill="#2E7D32" font-size="10" text-anchor="start">SSM: none</text>
  <text x="435" y="125" class="lbl" fill="#2E7D32" font-size="10" font-weight="700" text-anchor="start">Default</text>

  <!-- OpenAI -->
  <rect x="420" y="170" width="280" height="120" class="bg" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="480" y="190" width="150" height="36" rx="6" fill="#424242"/>
  <text x="555" y="208" class="lbl" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">OpenAI API</text>
  <text x="435" y="245" class="lbl" fill="#1565C0" font-size="10" text-anchor="start">Auth: OPENAI_API_KEY</text>
  <text x="435" y="260" class="lbl" fill="#1565C0" font-size="10" text-anchor="start">SSM: /devless/openai-api-key</text>

  <!-- Azure OpenAI -->
  <rect x="420" y="320" width="280" height="160" class="bg" fill="#E8EAF6" stroke="#283593" stroke-width="1.5"/>
  <rect x="480" y="340" width="150" height="36" rx="6" fill="#0078D4"/>
  <text x="555" y="358" class="lbl" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Azure OpenAI</text>
  <text x="435" y="395" class="lbl" fill="#283593" font-size="10" text-anchor="start">Auth: AZURE_API_KEY</text>
  <text x="435" y="410" class="lbl" fill="#283593" font-size="10" text-anchor="start">SSM: /devless/azure-api-key</text>
  <text x="435" y="425" class="lbl" fill="#283593" font-size="10" text-anchor="start">SSM: /devless/azure-api-base</text>
  <text x="435" y="440" class="lbl" fill="#283593" font-size="10" text-anchor="start">SSM: /devless/azure-api-version</text>

  <!-- ════════ Arrows ════════ -->

  <!-- Pipeline → Aider Core -->
  <line x1="170" y1="78" x2="170" y2="136" class="arrow" stroke="#546E7A" marker-end="url(#a-grey)"/>

  <!-- Aider Core → Router -->
  <line x1="170" y1="184" x2="170" y2="208" class="arrow" stroke="#546E7A" marker-end="url(#a-grey)"/>

  <!-- Config → Router (dashed) -->
  <line x1="170" y1="370" x2="170" y2="332" class="arrow-d" stroke="#F9A825" marker-end="url(#a-yellow)"/>
  <text x="185" y="352" class="lbl" fill="#F9A825" font-size="10">model</text>

  <!-- Router → Bedrock -->
  <path d="M 260,260 L 360,260 L 360,75 L 418,75" class="arrow" stroke="#388E3C" fill="none" marker-end="url(#a-green)"/>
  <text x="370" y="168" class="lbl" fill="#388E3C" font-size="10" font-weight="700">bedrock/*</text>

  <!-- Router → OpenAI -->
  <path d="M 260,270 L 390,270 L 390,225 L 418,225" class="arrow" stroke="#1565C0" fill="none" marker-end="url(#a-blue)"/>
  <text x="370" y="252" class="lbl" fill="#1565C0" font-size="10">o3, gpt-4o, ...</text>

  <!-- Router → Azure -->
  <path d="M 260,280 L 360,280 L 360,375 L 418,375" class="arrow" stroke="#283593" fill="none" marker-end="url(#a-navy)"/>
  <text x="370" y="340" class="lbl" fill="#283593" font-size="10">azure/*</text>

</svg>
