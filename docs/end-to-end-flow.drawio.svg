<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="930" height="760" viewBox="-5 -5 930 760"
     content="see docs/end-to-end-flow.drawio for editable source">
  <defs>
    <style type="text/css">
      .lbl { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; dominant-baseline:central; }
      .msg { fill:none; stroke:#333; stroke-width:1.5; }
      .msg-ret { fill:none; stroke:#333; stroke-width:1.5; stroke-dasharray:6 3; }
      .lifeline { stroke:#B0BEC5; stroke-width:1; stroke-dasharray:6 4; fill:none; }
      .act { fill:#E0E0E0; stroke:#999; stroke-width:1; }
      .frame { fill:none; stroke:#546E7A; stroke-width:1.5; stroke-dasharray:6 3; }
    </style>
    <marker id="solid" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#333"/></marker>
    <marker id="open" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polyline points="0 0,10 4,0 8" fill="none" stroke="#333" stroke-width="1.5"/></marker>
  </defs>

  <!-- White background for dark mode -->
  <rect x="-5" y="-5" width="930" height="760" fill="#fff"/>

  <!-- ══ AWS swimlane ══ -->
  <rect x="270" y="0" width="650" height="750" rx="0" fill="#F9F9F9" stroke="#232F3E" stroke-width="2"/>
  <rect x="270" y="0" width="40" height="18" fill="#232F3E"/>
  <text x="290" y="10" class="lbl" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">AWS</text>

  <!-- ══ Actors ══ -->

  <!-- Dev (stick figure) -->
  <circle cx="90" cy="28" r="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="36" x2="90" y2="54" stroke="#333" stroke-width="1.5"/>
  <line x1="76" y1="44" x2="104" y2="44" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="54" x2="78" y2="66" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="54" x2="102" y2="66" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="80" class="lbl" fill="#333" font-size="12" font-weight="700" text-anchor="middle">Dev</text>

  <!-- :GitHub -->
  <rect x="190" y="20" width="80" height="28" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="230" y="34" class="lbl" fill="#333" font-size="11" text-anchor="middle">:GitHub</text>

  <!-- :Webhook Handler -->
  <rect x="345" y="20" width="90" height="28" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="30" class="lbl" fill="#333" font-size="10" text-anchor="middle">:Webhook</text>
  <text x="390" y="42" class="lbl" fill="#333" font-size="10" text-anchor="middle">Handler</text>

  <!-- :SQS -->
  <rect x="510" y="20" width="60" height="28" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="540" y="34" class="lbl" fill="#333" font-size="11" text-anchor="middle">:SQS</text>

  <!-- :Orchestrator -->
  <rect x="640" y="20" width="90" height="28" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="685" y="34" class="lbl" fill="#333" font-size="10" text-anchor="middle">:Orchestrator</text>

  <!-- :Aider -->
  <rect x="820" y="20" width="60" height="28" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="850" y="34" class="lbl" fill="#333" font-size="11" text-anchor="middle">:Aider</text>

  <!-- ══ Lifelines ══ -->
  <line x1="90" y1="86" x2="90" y2="740" class="lifeline"/>
  <line x1="230" y1="48" x2="230" y2="740" class="lifeline"/>
  <line x1="390" y1="48" x2="390" y2="740" class="lifeline"/>
  <line x1="540" y1="48" x2="540" y2="740" class="lifeline"/>
  <line x1="685" y1="48" x2="685" y2="740" class="lifeline"/>
  <line x1="850" y1="48" x2="850" y2="740" class="lifeline"/>

  <!-- ══ Activation boxes ══ -->
  <rect x="225" y="100" width="10" height="55" class="act"/>
  <rect x="385" y="175" width="10" height="90" class="act"/>
  <rect x="535" y="245" width="10" height="70" class="act"/>
  <rect x="680" y="295" width="10" height="200" class="act"/>
  <rect x="845" y="395" width="10" height="55" class="act"/>
  <rect x="225" y="475" width="10" height="130" class="act"/>
  <rect x="225" y="645" width="10" height="75" class="act"/>

  <!-- ═══ Combined fragment: alt [open issue / comment on issue] ═══ -->
  <rect x="50" y="95" width="230" height="65" fill="none" stroke="#546E7A" stroke-width="1.5"/>
  <rect x="50" y="95" width="28" height="16" fill="#546E7A"/>
  <text x="64" y="104" class="lbl" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">alt</text>
  <text x="85" y="104" class="lbl" fill="#546E7A" font-size="9" font-style="italic" text-anchor="start">[new issue]</text>

  <!-- Alt: open issue -->
  <line x1="90" y1="115" x2="223" y2="115" class="msg" marker-end="url(#solid)"/>
  <text x="156" y="107" class="lbl" fill="#333" font-size="11" text-anchor="middle">open issue</text>

  <!-- Alt divider -->
  <line x1="50" y1="135" x2="280" y2="135" stroke="#546E7A" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="85" y="133" class="lbl" fill="#546E7A" font-size="9" font-style="italic" text-anchor="start">[comment on issue]</text>

  <!-- Alt: comment on issue -->
  <line x1="90" y1="150" x2="223" y2="150" class="msg" marker-end="url(#solid)"/>
  <text x="156" y="142" class="lbl" fill="#333" font-size="11" text-anchor="middle">comment on issue</text>

  <!-- 2. GitHub → Webhook Handler: webhook event -->
  <line x1="235" y1="180" x2="383" y2="180" class="msg" marker-end="url(#solid)"/>
  <text x="310" y="172" class="lbl" fill="#333" font-size="11" text-anchor="middle">webhook event</text>

  <!-- 3. Webhook Handler self: validate HMAC -->
  <path d="M 395,205 L 425,205 L 425,225 L 397,225" class="msg" marker-end="url(#solid)"/>
  <text x="440" y="215" class="lbl" fill="#666" font-size="10" text-anchor="start">validate HMAC</text>

  <!-- 4. Webhook Handler → SQS: enqueue -->
  <line x1="395" y1="250" x2="533" y2="250" class="msg" marker-end="url(#solid)"/>
  <text x="464" y="242" class="lbl" fill="#333" font-size="11" text-anchor="middle">enqueue task</text>

  <!-- 5. SQS → Orchestrator: deliver -->
  <line x1="545" y1="300" x2="678" y2="300" class="msg" marker-end="url(#solid)"/>
  <text x="612" y="292" class="lbl" fill="#333" font-size="11" text-anchor="middle">deliver message</text>

  <!-- 6. Orchestrator → GitHub: clone -->
  <line x1="680" y1="350" x2="237" y2="350" class="msg" marker-end="url(#solid)"/>
  <text x="458" y="342" class="lbl" fill="#333" font-size="11" text-anchor="middle">clone repo</text>

  <!-- 7. Orchestrator → Aider: generate -->
  <line x1="690" y1="400" x2="843" y2="400" class="msg" marker-end="url(#solid)"/>
  <text x="766" y="392" class="lbl" fill="#333" font-size="11" text-anchor="middle">generate code</text>

  <!-- 7b. Aider → Orchestrator: return -->
  <line x1="843" y1="440" x2="692" y2="440" class="msg-ret" marker-end="url(#open)"/>
  <text x="766" y="432" class="lbl" fill="#666" font-size="10" text-anchor="middle">result</text>

  <!-- 8. Orchestrator → GitHub: open PR -->
  <line x1="680" y1="480" x2="237" y2="480" class="msg" marker-end="url(#solid)"/>
  <text x="458" y="472" class="lbl" fill="#333" font-size="11" text-anchor="middle">open PR</text>

  <!-- ── Combined fragment: loop [CI fails] ── -->
  <rect x="185" y="510" width="560" height="100" class="frame" rx="0"/>
  <rect x="185" y="510" width="38" height="16" fill="#546E7A"/>
  <text x="204" y="519" class="lbl" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">loop</text>
  <line x1="223" y1="526" x2="185" y2="526" stroke="#546E7A" stroke-width="1"/>
  <line x1="223" y1="526" x2="228" y2="521" stroke="#546E7A" stroke-width="1"/>
  <text x="235" y="520" class="lbl" fill="#546E7A" font-size="10" font-style="italic" text-anchor="start">[CI fails]</text>

  <!-- Inside loop: GitHub → Orchestrator: check_run failure -->
  <line x1="235" y1="545" x2="678" y2="545" class="msg" marker-end="url(#solid)"/>
  <text x="456" y="537" class="lbl" fill="#333" font-size="11" text-anchor="middle">check_run failure</text>

  <!-- Inside loop: Orchestrator → GitHub: push fix -->
  <line x1="680" y1="585" x2="237" y2="585" class="msg" marker-end="url(#solid)"/>
  <text x="458" y="577" class="lbl" fill="#333" font-size="11" text-anchor="middle">auto-fix &amp; push</text>

  <!-- 9. Dev → GitHub: review -->
  <line x1="90" y1="650" x2="223" y2="650" class="msg" marker-end="url(#solid)"/>
  <text x="156" y="642" class="lbl" fill="#333" font-size="11" text-anchor="middle">review &amp; approve</text>

  <!-- 10. GitHub self: auto-merge -->
  <path d="M 235,690 L 265,690 L 265,710 L 237,710" class="msg" marker-end="url(#solid)"/>
  <text x="280" y="700" class="lbl" fill="#666" font-size="10" text-anchor="start">auto-merge</text>

</svg>
